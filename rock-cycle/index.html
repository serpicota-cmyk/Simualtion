;outline-offset:2px}.credit{display:block;margin-top:16px;color:var(--muted);font-size:.8rem}.credit a{color:inherit}

<main>
<header class="page-header">

<div class="layout">

</main>
<script>
'use strict';
const topics = [
  ['eruption','Eruption','Process',14,12,'An <strong>eruption</strong> happens when <strong>magma</strong> reaches the surface and comes out as <strong>lava</strong>. The lava cools into <strong>igneous rock</strong>.',[[137,150],[137,76],[163,123]]],
  ['erosion','Erosion','Process',56,8,'Water and wind-blown sand can wear rock down. In <strong>erosion</strong>, wind and water carry the loose pieces away as <strong>sediment</strong>.',[[488,68],[550,129],[602,171]]],
  ['transport','Transportation','Process',79,19,'During <strong>transportation</strong>, flowing water carries <strong>sediment</strong> downstream. When the water slows, some pieces settle to the bottom.',[[602,171],[724,187],[849,221]]],
  ['sediment','Sediment','Material',91,35,'<strong>Sediment</strong> is loose material such as gravel, sand, and mud. During <strong>erosion</strong>, wind and water carry it away. It can then settle in layers under water.',[[903,194],[904,221],[904,246]]],
  ['sedimentation','Sedimentation','Process',77,45,'In <strong>sedimentation</strong>, gravel, sand, and mud settle in layers under water. Over time, the weight of new layers squeezes older layers. Minerals can stick the grains together to form <strong>sedimentary rock</strong>.',[[849,221],[817,270],[790,352]]],
  ['sedimentary','Sedimentary rock','Rock type',79,64,'<strong>Sedimentary rock</strong> can <strong>form</strong> from layers of sediment. The <strong>movement</strong> of wind and water carries the sediment to new places. Over time, squeezing and minerals sticking the grains together <strong>change</strong> loose sediment into solid rock.',[[817,270],[804,314],[790,352]]],
  ['pressure','Heat and pressure','Process',73,72,'Deep underground, <strong>heat</strong> and <strong>pressure</strong> can change the minerals in <strong>sedimentary rock</strong>. Pressure can bend the layers. This is called <strong>folding</strong>. The rock stays solid as it changes into <strong>metamorphic rock</strong>.',[[790,352],[735,386],[668,419],[618,447],[550,462]]],
  ['metamorphic','Metamorphic rock','Rock type',55,83,'<strong>Metamorphic rock</strong> can <strong>form</strong> when heat and pressure <strong>change</strong> solid rock. The <strong>movement</strong> of Earth’s plates can push rock deeper and squeeze or bend it. If the rock gets hot enough to melt, it becomes <strong>magma</strong>.',[[618,447],[581,455],[550,462]]],
  ['melting','Melting','Process',43,72,'In <strong>melting</strong>, enough heat turns solid <strong>metamorphic rock</strong> into liquid <strong>magma</strong>. The magma can collect underground and later rise toward a volcano.',[[507,460],[414,455],[279,432]]],
  ['magma','Magma','Material',25,78,'<strong>Magma</strong> is melted rock below Earth’s surface. If it rises and comes out of a volcano, it is called <strong>lava</strong>.',[[264,456],[228,417],[204,364]]],
  ['cooling','Cooling','Process',24,27,'After an eruption, <strong>lava</strong> loses heat. This <strong>cooling</strong> turns the lava into solid <strong>igneous rock</strong>.',[[207,154],[247,174],[302,180]]],
  ['igneous','Igneous rock','Rock type',32,38,'<strong>Igneous rock</strong> can <strong>form</strong> when lava or magma cools. It goes through a <strong>change</strong> from liquid to solid. The <strong>movement</strong> of lava brings melted rock across the surface before it cools.',[[247,174],[276,184],[302,180]]],
  ['burial','Burial','Process',37,57,'In <strong>burial</strong>, layers of sediment build up over <strong>igneous rock</strong>. Deep underground, <strong>heat and pressure</strong> can change the solid rock into <strong>metamorphic rock</strong>.',[[302,180],[373,338],[550,462]]],
  ['source','Magma from the mantle','Process',25,94,'Some rock in the <strong>mantle</strong> can melt. The melted part becomes <strong>magma</strong> and can rise toward the surface.',[[258,555],[297,504],[297,454]]],
  ['mantle','Mantle','Place',85,94,'The <strong>mantle</strong> is a thick layer deep inside Earth. It is mostly solid rock. Some of that rock can melt and form <strong>magma</strong>.',[[875,549],[824,549],[773,549]]]
].map(([id,name,type,x,y,description,path])=>({id,name,type,x,y,description,path}));
const byId=id=>document.getElementById(id);
const map=byId('map');
const ctx=byId('landscape').getContext('2d');
const demo=byId('demo').getContext('2d');
const controls=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let selected=topics[0], progress=1, last=null, frame=null;
const duration=3400;
const eruptionDuration=10000;
const tau=Math.PI*2;
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const surface=[[0,193],[54,174],[104,130],[137,73],[161,99],[210,160],[276,184],[326,177],[383,148],[431,121],[488,64],[511,96],[538,104],[575,147],[623,169],[697,185],[762,193],[838,190],[914,202],[1000,194]];
const summitRoute=surface.filter(([x])=>x>=137&&x<=488);
const lavaPool=[321,178];
const lavaToPool=[...summitRoute.filter(([x])=>x<lavaPool[0]),lavaPool];
const lavaFromPool=[lavaPool,...summitRoute.filter(([x])=>x>lavaPool[0])];
const erosionSlope=surface.filter(([x])=>x>=488&&x<=623);
function poly(c,points,fill,stroke,width=1){
  c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));
  if(fill){c.closePath();c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.lineJoin='round';c.lineCap='round';c.stroke();}
}
function dot(c,x,y,r,color){
  c.beginPath();c.arc(x,y,r,0,tau);c.fillStyle=color;c.fill();
}
function band(c,top,bottom,color){poly(c,[...top,...bottom.slice().reverse()],color);}
function track(path,t){
  const k=clamp(t)*(path.length-1), i=Math.min(path.length-2,Math.floor(k));
  return [mix(path[i][0],path[i+1][0],k-i),mix(path[i][1],path[i+1][1],k-i)];
}
function arrow(c,path,color,width){
  poly(c,path,null,color,width);
  const [b,end]=path.slice(-2);
  const angle=Math.atan2(end[1]-b[1],end[0]-b[0]);
  poly(c,[end,[end[0]-13*Math.cos(angle-.5),end[1]-13*Math.sin(angle-.5)],[end[0]-13*Math.cos(angle+.5),end[1]-13*Math.sin(angle+.5)]],color);
}
function rock(c,x,y,w,h,color,kind){
  const shape=[[x-w*.49,y+h*.29],[x-w*.54,y-h*.04],[x-w*.30,y-h*.43],[x+w*.07,y-h*.52],[x+w*.38,y-h*.28],[x+w*.53,y+h*.18],[x+w*.31,y+h*.46],[x-w*.28,y+h*.49]];
  poly(c,shape,color,'#493c36',2);
  c.save();c.clip();
  if(kind==='sedimentary'||kind==='metamorphic'){
    for(let i=-2;i<4;i++){
      const yy=y+i*h*.19;
      const fold=kind==='metamorphic'?h*.27:0;
      poly(c,[[x-w*.57,yy],[x-w*.22,yy-fold],[x+w*.05,yy+fold*.4],[x+w*.31,yy-fold*.4],[x+w*.56,yy+fold]],null,i%2?'#f3be81':'#704746',h*.075);
    }
  }else{
    for(let i=0;i<17;i++){
      const dx=Math.sin(i*17.7)*w*.48;
      const dy=Math.cos(i*29.3)*h*.47;
      if(kind==='igneous') poly(c,[[x+dx,y+dy-5],[x+dx+4,y+dy],[x+dx,y+dy+5],[x+dx-4,y+dy]],i%2?'#e4d6c3':'#534b56');
      else dot(c,x+dx,y+dy,1+i%3,i%2?'#b59272':'#674d3b');
    }
  }
  c.restore();
}
function landscape(){
  const sky=ctx.createLinearGradient(0,0,0,200);
  sky.addColorStop(0,'#bad7e1');sky.addColorStop(1,'#eff3e7');
  ctx.fillStyle=sky;ctx.fillRect(0,0,1000,590);
  poly(ctx,[[5,180],[110,133],[218,144],[285,97],[375,150],[486,113],[578,131],[664,109],[792,159],[1000,147],[1000,212],[0,212]],'#9fadb2');
  poly(ctx,[[0,190],[1000,190],[1000,590],[0,590]],'#a95748');
  const deep=[[0,481],[150,499],[315,475],[445,490],[561,520],[693,508],[833,517],[1000,491]];
  band(ctx,deep,[[0,590],[1000,590]],'#b9583f');
  const folded=[[0,376],[130,394],[315,378],[434,391],[535,418],[623,397],[715,380],[803,425],[869,409],[1000,397]];
  band(ctx,folded,deep,'#886675');
  for(let i=1;i<=5;i++){
    poly(ctx,folded.map(([x,y],j)=>[x,y+i*13+(j%2)*3]),null,i%2?'#b68b93':'#6b5369',5);
  }
  const base=[[0,287],[109,273],[260,301],[389,303],[507,330],[624,306],[753,327],[875,312],[1000,315]];
  band(ctx,base,folded,'#bd8568');
  const upper=[[0,238],[119,208],[264,234],[384,218],[502,216],[631,224],[760,253],[870,257],[1000,239]];
  band(ctx,upper,base,'#d8af79');
  for(let i=1;i<=4;i++){
    poly(ctx,upper.map(([x,y],j)=>[x,y+i*16+(j%2)*2]),null,i%2?'#ab7759':'#ebca95',4);
  }
  band(ctx,surface,upper,'#7c9466');
  poly(ctx,[[55,174],[104,130],[137,73],[161,99],[210,160],[276,184],[213,196],[132,179],[90,190]],'#65666a');
  poly(ctx,[[115,122],[137,73],[158,95],[147,98],[136,110]],'#3e4149');
  poly(ctx,[[383,148],[431,121],[488,64],[511,96],[538,104],[575,147],[550,152],[499,134],[463,139],[420,157]],'#7f8992');
  poly(ctx,[[440,113],[488,64],[511,96],[538,104],[518,108],[496,98],[484,111],[473,101]],'#edf0e8');
  poly(ctx,[[136,84],[144,116],[157,153],[163,188],[191,235],[204,283],[196,345],[222,396]],null,'#8e5145',26);
  poly(ctx,[[136,84],[144,116],[157,153],[163,188],[191,235],[204,283],[196,345],[222,396]],null,'#e5784e',11);
  poly(ctx,[[180,395],[218,378],[285,388],[326,416],[316,454],[273,471],[221,463],[184,445],[166,421]],'#f28248','#6b3d46',5);
  poly(ctx,[[232,432],[247,415],[291,421],[310,432],[281,443],[250,443]],'#ffbf62');
  poly(ctx,[[532,135],[582,164],[630,177],[682,180],[723,196],[780,199],[837,196],[891,214],[937,214],[1000,204],[1000,239],[928,250],[858,230],[804,225],[771,229],[707,210],[659,198],[607,190],[562,170]],'#527f92');
  poly(ctx,[[613,183],[669,187],[730,204],[783,210],[831,205],[890,224],[952,232],[995,223]],null,'#a0cad3',3);
  for(let i=0;i<38;i++){const x=830+(i*43)%165,y=237+(i*13)%17;dot(ctx,x,y,1+i%3,i%2?'#e9c794':'#986c52');}
  rock(ctx,302,180,73,50,'#918495','igneous');
  ctx.save();
  ctx.setLineDash([4,4]);
  poly(ctx,[[267,181],[276,184],[326,177],[337,171]],null,'#f8e5b0',2);
  ctx.restore();
  rock(ctx,790,352,80,48,'#ba805b','sedimentary');
  rock(ctx,550,462,90,49,'#a97e80','metamorphic');
  ['erosion','transport','sedimentation','pressure','melting','cooling','burial','source'].forEach(id=>{
    const topic=topics.find(item=>item.id===id);
    arrow(ctx,topic.path,'#234a47',6);
    arrow(ctx,topic.path,'#c2f4de',3);
  });
}
function mapEffect(topic,t){
  if(!topic)return;
  if(topic.id==='eruption'){
    eruption(ctx,t,[[218,397],[196,345],[204,283],[191,235],[163,188],[157,153],[144,116],summitRoute[0]],lavaToPool,1.35,.64);
    const pooling=ease(clamp((t-.64)/.15));
    if(pooling>0){
      magma(ctx,lavaPool[0],lavaPool[1],6+20*pooling,2+5*pooling);
      flowingLine(ctx,lavaFromPool,clamp((t-.79)/.21),1.35);
    }
    return;
  }
  if(topic.id==='erosion'){
    tumblingRocks(ctx,t,erosionSlope,1);
    return;
  }
  if(topic.id==='transport'){
    riverFlow(ctx,t,[[602,179],[755,204],[973,230]],1.05);
  }
  if(topic.id==='sedimentation'||topic.id==='sediment'){
    ctx.save();
    ctx.translate(852,210);
    ctx.scale(.32,.21);
    sedimentLayers(ctx,t);
    ctx.restore();
    if(topic.id==='sedimentation')return;
  }
  if(topic.id==='melting'){
    flowingLine(ctx,topic.path,t,1);
  }
  if(topic.id==='cooling'){
    flowingLine(ctx,[[137,75],[161,99],topic.path[0]],1,.8);
  }
  arrow(ctx,topic.path,'#6d372a',6);
  arrow(ctx,topic.path,'#ffe39c',2);
  for(let i=0;i<7;i++){
    const q=clamp(t*1.3-i*.055);
    const [x,y]=track(topic.path,q);
    dot(ctx,x,y,5+(i%2),i%2?'#fff1c5':'#aa3d26');
  }
}
function layers(c,fold,down=0){
  for(let i=0;i<5;i++){
    const y=82+i*20+down;
    const pts=Array.from({length:31},(_,j)=>[30+j*12,y+Math.sin(j*.34+i*.18)*fold]);
    poly(c,pts,null,['#b17853','#d49c6b','#865d57','#e0b384','#a46e59'][i],15);
  }
}
function magma(c,x,y,w,h){
  const points=Array.from({length:50},(_,i)=>{
    const a=i*tau/50,r=1+.1*Math.sin(a*3)+.05*Math.cos(a*7);
    return [x+Math.cos(a)*w*r,y+Math.sin(a)*h*r];
  });
  poly(c,points,'#d86439','#993a31',2);
  poly(c,points.map(([px,py])=>[mix(x,px,.73),mix(y,py,.67)]),'#ffad50');
  dot(c,x-w*.29,y-h*.16,5,'#ffe38e');dot(c,x+w*.3,y+h*.25,4,'#ffdb79');
}
function grains(c,t,kind){
  if(kind==='sedimentation')poly(c,[[0,153],[420,153],[420,210],[0,210]],'#d9b384');
  for(let i=0;i<28;i++){
    const q=ease(clamp(t*1.6-(i%7)*.1));
    const x=kind==='sedimentation'?45+(i*73)%330:80+(i*13)%96+q*(95+(i*37)%129);
    const y=kind==='sedimentation'?38+(i*19)%56+q*(84+(i%3)*13):86+(i*23)%62+q*(32+(i%5)*5);
    dot(c,x,y,2+i%4,['#8b5d46','#c98754','#e3bb88'][i%3]);
  }
}
function riverFlow(c,t,route,scale=1){
  for(let i=0;i<20;i++){
    const q=(t*1.7+i/20)%1;
    const [x,y]=track(route,q);
    const offset=(i%5-2)*4*scale;
    poly(c,[[x-13*scale,y+offset],[x,y+offset+1],[x+8*scale,y+offset]],null,i%2?'#b8e1e6':'#407f96',2*scale);
  }
  for(let i=0;i<12;i++){
    const q=(t*(.73+(i%3)*.13)+i/12)%1;
    const [x,y]=track(route,q);
    const py=y+(i%5-2)*4*scale;
    const r=(2+i%4)*scale;
    poly(c,[[x-r,py+r*.6],[x-r*.72,py-r*.7],[x+r*.38,py-r],[x+r,py+r*.5]],['#614b40','#d6aa79','#956b57'][i%3],'#4e4b43',.8);
  }
}
function sedimentLayers(c,t){
  const colors=['#7e6055','#c99659','#aa6954'];
  const settles=[.30,.56,.79];
  const squeeze=ease(clamp((t-.79)/.21));
  for(let layer=0;layer<3;layer++){
    const progress=ease(clamp((t-layer*.16)/(settles[layer]-layer*.16)));
    const height=mix(27,16,squeeze);
    const bottom=192-layer*height;
    if(progress>.65){
      c.save();c.globalAlpha=clamp((progress-.65)/.35);
      c.fillStyle=colors[layer];c.fillRect(18,bottom-height,384,height);
      c.restore();
    }
    for(let i=0;i<22;i++){
      const x=27+i*17+(i%3)*2;
      const y=mix(15+(i*19)%78,bottom-height*.5+(i%3-1)*height*.23,progress);
      const r=[5,3,1.7][layer];
      dot(c,x,y,r,i%2?colors[layer]:['#ab8871','#f5cf92','#d79b83'][layer]);
    }
  }
  if(squeeze>0)squeezeArrow(c,210,80+squeeze*31,1,squeeze);
}
function squeezeArrow(c,x,y,direction,alpha){
  c.save();c.globalAlpha=alpha;
  arrow(c,[[x,y],[x,y+direction*13],[x,y+direction*26]],'#ffdb91',5);
  c.restore();
}
function flowingLine(c,route,amount,scale){
  if(amount<=0)return;
  const lengths=route.slice(1).map(([x,y],i)=>Math.hypot(x-route[i][0],y-route[i][1]));
  let remaining=lengths.reduce((total,length)=>total+length,0)*amount;
  const points=[route[0]];
  for(const [i,length] of lengths.entries()){
    const [x,y]=route[i], [nextX,nextY]=route[i+1];
    const fraction=clamp(remaining/length);
    points.push([mix(x,nextX,fraction),mix(y,nextY,fraction)]);
    remaining-=length;
    if(remaining<=0)break;
  }
  poly(c,points,null,'#852b26',15*scale);
  poly(c,points,null,'#f46a28',10*scale);
  poly(c,points,null,'#ffe36e',4*scale);
}
function eruption(c,t,vent,lava,scale,flowEnd=1){
  const [x,y]=vent.at(-1);
  c.save();
  c.shadowColor='#ff793c';c.shadowBlur=13*scale;
  flowingLine(c,vent,clamp(t/.32),scale*.8);
  const burst=clamp((t-.30)/.70);
  if(t>.30){
    for(let i=0;i<10;i++){
      const q=clamp(burst*1.6-i*.042);
      if(q>0)dot(c,x-25*q*scale+Math.sin(i*2)*13*scale,y-(13+33*q)*scale,(5+q*12)*scale,'#42313b42');
    }
    for(let i=0;i<21;i++){
      const q=clamp(burst*1.9-i*.032);
      if(q>0){
        const dx=(i%2===0?1:-1)*(11+i%7*5);
        const height=(19+i%6*6)*Math.sin(Math.PI*q)-q*q*24;
        dot(c,x+dx*q*scale,y-height*scale,(2+i%4)*scale,i%2?'#ffe074':'#f9773c');
      }
    }
  }
  flowingLine(c,lava,clamp((t-.39)/(flowEnd-.39)),scale);
  c.restore();
}
function tumblingRocks(c,t,slope,scale){
  for(let i=0;i<5;i++){
    const travel=clamp((t-i*.09)/.60);
    if(travel<=0)continue;
    const [x,y]=track(slope,travel);
    const size=(9-i*.65)*mix(1,.30,travel)*scale;
    const bounce=Math.abs(Math.sin(travel*5*Math.PI))*8*(1-travel)*scale;
    c.save();
    c.translate(x,y-size-bounce);
    c.rotate(travel*14+i);
    poly(c,[[-size,-size*.22],[-size*.30,-size],[size*.76,-size*.67],[size,size*.43],[0,size*.86]],'#987863','#503c34',scale);
    c.restore();
    for(let chip=1;chip<=2;chip++){
      const shed=clamp((travel-chip*.26)*2.4);
      if(shed<=0)continue;
      const [chipX,chipY]=track(slope,Math.max(0,travel-chip*.06));
      dot(c,chipX,chipY-(1-shed)*10*scale,(2.6-chip*.52)*scale,'#795443');
    }
  }
}
function erosion(c,t){
  c.fillStyle='#d8e8e9';c.fillRect(0,0,420,210);
  const slope=[[123,58],[165,86],[223,124],[292,154],[382,179]];
  poly(c,[[0,152],...slope,[420,182],[420,210],[0,210]],'#b89972');
  const runoff=[[127,149],[252,170],[419,179]];
  poly(c,runoff,null,'#559bb1',10+8*t);
  rock(c,135,118,134-36*t,94-17*t,'#9b806d','plain');
  poly(c,[[132,77],[140,99],[128,114],[145,138]],null,'#55463d',1+3*t);
  // Rain strikes the rock while wind blows sand across it.
  for(let i=0;i<23;i++){
    const x=60+i*9%165,y=18+(i*19+t*320)%112;
    poly(c,[[x,y],[x-6,y+13]],null,'#367f9d',2);
  }
  for(let i=0;i<8;i++){
    const x=(i*57+t*335)%390,y=35+i*13%91;
    poly(c,[[x,y],[x+12,y-3],[x+29,y-2]],null,'#fff8e6',3);
    dot(c,x+17,y+5,2,'#946c46');
  }
  for(let i=0;i<16;i++){
    const q=clamp(t*1.45-i*.027);
    const [x,y]=track(runoff,q);
    dot(c,x+i%3,y+Math.sin(i*7)*6,2+i%3,'#76533d');
  }
  tumblingRocks(c,t,slope,1.25);
}
function hotBackground(c,t,melting){
  const heat=c.createLinearGradient(0,0,0,210);
  heat.addColorStop(0,'#251924');
  heat.addColorStop(.56,melting?'#71332d':'#553039');
  heat.addColorStop(1,melting?'#c8572d':'#98422e');
  c.fillStyle=heat;c.fillRect(0,0,420,210);
  poly(c,[[0,29],[104,56],[230,39],[323,64],[420,47]],null,'#b15b4d',4);
  poly(c,[[0,171],[113,184],[242,162],[338,179],[420,157]],null,'#e68b57',4);
  for(let i=0;i<7;i++){
    const x=26+(i*61)%377,y=184-(i*23+t*170)%123;
    poly(c,[[x,y],[x+4,y-7],[x-2,y-15],[x+2,y-22]],null,'#ffba76aa',2.5);
  }
}
function preview(topic,t){
  const c=demo,e=ease(t);
  c.clearRect(0,0,420,210);
  c.fillStyle='#f0e4d0';c.fillRect(0,0,420,210);
  switch(topic.id){
    case 'erosion':
      erosion(c,t);break;
    case 'transport':
      c.fillStyle='#c0a47e';c.fillRect(0,0,420,210);
      poly(c,[[0,63],[134,82],[262,71],[420,93],[420,185],[274,166],[136,177],[0,154]],'#689bb0');
      riverFlow(c,t,[[0,109],[182,130],[419,144]],2);break;
    case 'sedimentation':case 'sediment':
      c.fillStyle='#91b7c0';c.fillRect(0,0,420,210);
      sedimentLayers(c,t);break;
    case 'pressure':
      hotBackground(c,t,false);
      c.save();c.translate(51,0);c.scale(.75,1);layers(c,26*e,-12);c.restore();
      squeezeArrow(c,210,20+e*22,1,1);squeezeArrow(c,210,196-e*15,-1,1);break;
    case 'burial': {
      hotBackground(c,t,false);
      c.fillStyle='#d5e5e5';c.fillRect(0,0,420,55);
      const cover=ease(clamp(t*1.6));
      for(let i=0;i<3;i++){
        const top=55+i*16;
        c.fillStyle=['#cea17a','#ad755d','#88545a'][i];
        c.fillRect(0,top,420,16*clamp(cover*3-i));
      }
      const depth=mix(55,142,cover);
      const change=ease(clamp((t-.6)/.4));
      c.save();c.globalAlpha=1-change;
      rock(c,210,depth,110,57,'#a093a4','igneous');c.restore();
      c.save();c.globalAlpha=change;
      rock(c,210,depth,118,51,'#a77b83','metamorphic');c.restore();
      squeezeArrow(c,210,depth-62,1,change);
      squeezeArrow(c,210,depth+63,-1,change);
      break;
    }
    case 'melting':
      hotBackground(c,t,true);
      if(t<.95)rock(c,291,80+e*24,132*(1-e*.83),82*(1-e*.8),'#ac7d82','metamorphic');
      magma(c,125,163,69+e*28,16+e*8);
      const meltRoute=[[285,112],[221,143],[125,160]];
      for(let i=0;i<7;i++){
        const q=clamp(t*1.6-i*.10);
        if(q>0){const [x,y]=track(meltRoute,q);dot(c,x,y,4+i%3,'#ffc269');}
      }
      break;
    case 'magma':case 'source':
      layers(c,3,4);magma(c,210,160,106,25);
      poly(c,[[230,157],[222,128],[239,103],[228,73]],null,'#6b4745',18);
      poly(c,[[230,157],[mix(230,222,e),mix(157,128,e)],[mix(230,239,e),mix(157,103,e)],[mix(230,228,e),mix(157,73,e)]],null,'#ef8c42',9);
      break;
    case 'cooling':case 'igneous':
      c.fillStyle='#d3e0e1';c.fillRect(0,0,420,210);
      poly(c,[[0,166],[95,48],[118,44],[217,120],[310,157],[420,165],[420,210],[0,210]],'#7f7068');
      const route=[[112,47],[218,121],[313,158]];
      c.save();c.globalAlpha=1-e;
      flowingLine(c,route,clamp(t*5+.15),1);
      magma(c,312,159,46,12);
      c.restore();
      c.save();c.globalAlpha=e;rock(c,310,154,102,48,'#a093a4','igneous');c.restore();
      break;
    case 'sedimentary':
      c.save();c.globalAlpha=1-e;grains(c,1,'sedimentation');c.restore();
      c.save();c.globalAlpha=e;rock(c,210,108,170,96,'#c48d64','sedimentary');c.restore();break;
    case 'metamorphic':
      hotBackground(c,t,false);
      c.save();c.globalAlpha=1-e;rock(c,210,108,168,91,'#bd966e','sedimentary');c.restore();
      c.save();c.globalAlpha=e;rock(c,210,108,168+e*12,91-e*17,'#a77b83','metamorphic');c.restore();
      squeezeArrow(c,210,20+e*16,1,1);squeezeArrow(c,210,195-e*15,-1,1);break;
    case 'eruption':
      c.fillStyle='#d3e0e1';c.fillRect(0,0,420,210);
      poly(c,[[0,174],[420,174],[420,210],[0,210]],'#8e9b75');
      poly(c,[[30,175],[149,125],[194,54],[223,54],[283,123],[390,175]],'#7f7068','#493c36',2);
      poly(c,[[194,54],[205,58],[223,54]],null,'#493c36',5);
      magma(c,171,176,48,16);
      eruption(c,t,[[171,176],[202,107],[208,55]],[[208,55],[269,113],[382,174]],1);
      break;
    case 'mantle':
      layers(c,2,-33);
      poly(c,[[30,136],[390,136],[390,191],[30,191]],'#b96045');
      c.save();c.globalAlpha=e*.65;
      poly(c,[[30,136],[390,136],[390,191],[30,191]],'#f8c765');
      c.restore();break;
  }
}
const mapBase=document.createElement('canvas');
mapBase.width=1000;mapBase.height=590;
landscape();
mapBase.getContext('2d').drawImage(byId('landscape'),0,0);
function draw(){
  ctx.clearRect(0,0,1000,590);ctx.drawImage(mapBase,0,0);mapEffect(selected,progress);
  preview(selected,progress);
}
function stop(){
  if(frame!==null)cancelAnimationFrame(frame);
  frame=null;last=null;
}
function updatePlayback(){
  const button=byId('pause');
  button.disabled=progress>=1;
  button.textContent=frame===null&&progress<1?'Resume':'Pause';
}
function tick(now){
  const playbackDuration=selected.id==='eruption'?eruptionDuration:duration;
  if(last!==null)progress=clamp(progress+(now-last)/playbackDuration);
  last=now;draw();
  if(progress<1)frame=requestAnimationFrame(tick);
  else{frame=null;last=null;updatePlayback();}
}
function replay(){
  stop();progress=0;draw();
  frame=requestAnimationFrame(tick);updatePlayback();
}
function select(topic,animate=true){
  selected=topic;stop();progress=1;
  byId('name').textContent=topic.name;
  byId('type').textContent=topic.type;
  byId('description').innerHTML=topic.description;
  byId('demo').setAttribute('aria-label','Animation of '+topic.name);
  controls.forEach(({button,id})=>button.setAttribute('aria-pressed',id===topic.id));
  if(rockExamples[topic.id])showExamples(topic.id);
  if(animate&&!reduce.matches)replay();
  else{draw();updatePlayback();}
}
function addButton(topic){
  const button=document.createElement('button');
  button.type='button';button.textContent=topic.name;
  button.classList.add(topic.type==='Process'?'process':'feature');
  button.classList.add('hotspot');
  button.style.setProperty('--x',topic.x+'%');button.style.setProperty('--y',topic.y+'%');
  if(topic.type==='Rock type')button.classList.add('rock');
  button.addEventListener('click',()=>select(topic));
  map.append(button);controls.push({button,id:topic.id});
}

const rockExamples={
  igneous:['Granite','Slow cooling underground makes large crystals. Granite forms many of the cliffs in Yosemite.'],
  sedimentary:['Sandstone','Sand grains stick together to form rock. Sandstone forms cliffs in Glen Canyon.'],
  metamorphic:['Marble','Heat and pressure change limestone into marble. People use marble for statues and floors.']
};
const exampleButtons=new Map();
function showExamples(id){
  const [name,description]=rockExamples[id];
  const output=byId('specimens');
  const card=document.createElement('article');card.className='specimen';
  const title=document.createElement('h3');title.textContent=name;
  const text=document.createElement('p');text.textContent=description;
  const photo=rockPhotos[name];
  const picture=document.createElement('img');
  picture.src=photo.data;picture.alt='Photograph of '+name.toLowerCase();picture.decoding='async';
  const credit=document.createElement('p');credit.className='photo-credit';
  const original=document.createElement('a');original.href=photo.source;
  original.textContent=photo.author||'Photo source';
  credit.append(original,document.createTextNode(' · '));
  const license=document.createElement('a');
  license.href=photo.licenseUrl||photo.source;license.textContent=photo.license;
  credit.append(license);
  const caption=document.createElement('div');
  caption.append(title,text,credit);
  card.append(picture,caption);
  output.replaceChildren(card);
  for(const [key,button] of exampleButtons)button.setAttribute('aria-pressed',key===id);
}
for(const id of Object.keys(rockExamples)){  const topic=topics.find(item=>item.id===id);
  const button=document.createElement('button');button.type='button';button.className='feature rock';
  button.textContent=topic.name;button.setAttribute('aria-pressed','false');
  button.addEventListener('click',()=>showExamples(topic.id));
  exampleButtons.set(topic.id,button);byId('index').append(button);
}
byId('replay').addEventListener('click',replay);
byId('pause').addEventListener('click',()=>{
  if(progress>=1)return;
  if(frame!==null)stop();
  else frame=requestAnimationFrame(tick);
  updatePlayback();
});
map.addEventListener('click',event=>{
  if(event.target!==byId('landscape'))return;
  const bounds=map.getBoundingClientRect();
  const x=(event.clientX-bounds.left)*1000/bounds.width,y=(event.clientY-bounds.top)*590/bounds.height;
  // A click on the illustration can also select the nearest named feature.
  const segmentDistance=([ax,ay],[bx,by])=>{
    const dx=bx-ax,dy=by-ay;
    const fraction=clamp(((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy));
    return Math.hypot(x-ax-fraction*dx,y-ay-fraction*dy);
  };
  const distance=topic=>Math.min(
    Math.hypot(x-topic.x*10,y-topic.y*5.9),
    ...topic.path.slice(1).map((point,i)=>segmentDistance(topic.path[i],point))
  );
  const nearest=topics.reduce((best,topic)=>distance(topic)<distance(best)?topic:best);
  select(nearest);
});
select(topics[0],false);
showExamples('igneous');
</script>
